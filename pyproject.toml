[project]
name = "atomsmltr"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexandre Dareau",email = "alexandre.dareau@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black (>=24.10.0,<25.0.0)",
    "scipy (>=1.15.1,<2.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)"
]

[tool.poetry]
packages = [{include = "atomsmltr", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ipykernel = "^6.29.5"


[tool.poetry.group.wayland.dependencies]
pyqt5 = "^5.15.11"


[tool.poetry.group.magpy.dependencies]
magpylib = "^5.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::UserWarning",
]
